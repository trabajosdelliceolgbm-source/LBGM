<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E5AA8"/>
      <stop offset="100%" stop-color="#132C54"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="600" height="600" fill="url(#bg)"/>

  <!-- Círculos decorativos, mismo estilo que los otros íconos -->
  <circle cx="470" cy="120" r="150" fill="#4C74B8" opacity="0.35"/>
  <circle cx="90" cy="500" r="170" fill="#132C54" opacity="0.45"/>

  <!-- Paleta de pintor -->
  <g transform="translate(300,255)">
    <path d="M0,-115
             C68,-115 122,-63 122,-2
             C122,40 96,62 62,62
             C46,62 34,52 34,38
             C34,26 44,18 44,6
             C44,-10 30,-22 10,-22
             C-58,-22 -122,-64 -122,-6
             C-122,63 -68,115 0,115
             Z"
          fill="#FFFDF8"/>
    <!-- hueco del pulgar -->
    <ellipse cx="-6" cy="88" rx="30" ry="22" fill="#2E5AA8"/>

    <!-- manchas de color sobre la paleta -->
    <circle cx="-58" cy="-58" r="17" fill="#E8AA1E"/>
    <circle cx="6" cy="-82" r="17" fill="#E4693B"/>
    <circle cx="66" cy="-52" r="17" fill="#4C7A3D"/>
    <circle cx="-78" cy="6" r="17" fill="#B9840E"/>
    <circle cx="80" cy="14" r="17" fill="#4C74B8"/>
  </g>

  <!-- Pincel cruzando la paleta -->
  <g transform="translate(300,255) rotate(38)">
    <rect x="-14" y="-190" width="28" height="150" rx="10" fill="#E8AA1E"/>
    <rect x="-18" y="-40" width="36" height="46" rx="8" fill="#B9840E"/>
    <path d="M-16,6 L16,6 L8,54 C8,70 -8,70 -8,54 Z" fill="#FFFDF8"/>
  </g>

  <!-- Gotas de pintura cayendo, para reforzar la idea de "pintar" -->
  <circle cx="150" cy="470" r="10" fill="#E4693B" opacity="0.85"/>
  <circle cx="185" cy="500" r="7" fill="#E8AA1E" opacity="0.85"/>
  <circle cx="440" cy="480" r="9" fill="#4C7A3D" opacity="0.85"/>
</svg>
